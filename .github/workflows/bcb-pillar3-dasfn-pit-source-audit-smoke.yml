name: bcb-pillar3-dasfn-pit-source-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/bcb-pillar3-dasfn-pit-source-audit-smoke.yml"
      - "scripts/bcb_pillar3_dasfn_pit_source_audit.py"
      - "src/ultimate_stock_analyzer/backtesting/bcb_pillar3_dasfn_pit_source_audit.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run live BCB Pillar 3 DASFN PIT source audit
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/bcb_pillar3_dasfn_pit_source_audit.py \
            --output bcb-pillar3-dasfn-pit-source-audit.json
      - name: Validate fail-closed DASFN boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("bcb-pillar3-dasfn-pit-source-audit.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_effect = (
              "diagnostic_only_pillar3_dasfn_pit_source_no_readiness_change"
          )
          if report["effect"] != expected_effect:
              raise SystemExit("unexpected Pillar 3 DASFN audit effect")
          if report["schema_version"] != "0.4":
              raise SystemExit("unexpected Pillar 3 DASFN audit schema")
          official_host = "https://olinda.bcb.gov.br/"
          probes = {item["name"]: item for item in report["catalog_probes"]}
          if set(probes) != {"base", "pillar3_query"}:
              raise SystemExit("expected base and pillar3_query probes")
          for probe in probes.values():
              if not probe["requested_url"].startswith(official_host):
                  raise SystemExit("probe escaped official BCB Olinda host")
              if probe["status_code"] is None:
                  if not probe["transport_error"]:
                      raise SystemExit("transport failure lacks provenance")
                  if probe["sha256"] is not None or probe["size_bytes"] != 0:
                      raise SystemExit("transport failure fabricated HTTP body provenance")
              else:
                  if len(probe["sha256"] or "") != 64:
                      raise SystemExit("HTTP response body SHA-256 is incomplete")
                  if probe["size_bytes"] < 0:
                      raise SystemExit("HTTP response size is invalid")
              if probe["http_success"]:
                  final_url = probe["final_url"]
                  if not final_url or not final_url.startswith(official_host):
                      required_blocker = "PILLAR3_DASFN_FINAL_URL_UNTRUSTED"
                      if required_blocker not in report["blockers"]:
                          raise SystemExit("successful off-host redirect lacks blocker")
          coverage = report["structured_coverage"]
          if coverage["v1_max_reference_date"] != "2023-06-30":
              raise SystemExit("unexpected Pillar 3 v1 coverage boundary")
          if coverage["v2_min_reference_date"] != "2025-12-31":
              raise SystemExit("unexpected Pillar 3 v2 coverage boundary")
          required = {
              "BANK_EVIDENCE_NOT_POINT_IN_TIME",
              "PILLAR3_DASFN_HISTORICAL_VINTAGE_QUERY_UNPROVEN",
              "PILLAR3_DASFN_PAYLOAD_PUBLICATION_TIMESTAMP_UNPROVEN",
              "PILLAR3_DASFN_REVISION_HISTORY_UNPROVEN",
              "PILLAR3_DASFN_STRUCTURED_COVERAGE_GAP",
          }
          if not required.issubset(report["blockers"]):
              raise SystemExit("required Pillar 3 DASFN blockers disappeared")
          if report["catalog_endpoint_available"]:
              final_url = probes["base"]["final_url"]
              if not final_url or not final_url.startswith(official_host):
                  raise SystemExit("untrusted base final URL counted as available")
          elif "PILLAR3_DASFN_CATALOG_ENDPOINT_UNAVAILABLE" not in report["blockers"]:
              raise SystemExit("catalog endpoint failure lacks blocker")
          if report["pillar3_query_available"]:
              final_url = probes["pillar3_query"]["final_url"]
              if not final_url or not final_url.startswith(official_host):
                  raise SystemExit("untrusted query final URL counted as available")
          elif "PILLAR3_DASFN_PILAR3_QUERY_UNAVAILABLE" not in report["blockers"]:
              raise SystemExit("Pillar 3 query failure lacks blocker")
          if report["catalog_contract_usable"]:
              observations = {
                  item["version_family"]: item
                  for item in report["version_observations"]
              }
              if set(observations) != {"v1", "v2"}:
                  raise SystemExit("usable contract must expose v1 and v2")
              if not report["pillar3_query_available"]:
                  raise SystemExit("unavailable query cannot expose usable contract")
          if report["institution_payloads_sampled"]:
              raise SystemExit("source-contract audit must not claim payload sampling")
          if report["payload_publication_timestamp_proven"]:
              raise SystemExit("payload publication timestamp was not proven")
          if report["revision_history_proven"]:
              raise SystemExit("revision history was not proven")
          if report["historical_vintage_query_proven"]:
              raise SystemExit("historical vintage query was not proven")
          if report["historical_replay_ready"]:
              raise SystemExit("DASFN historical replay must remain blocked")
          if report["bank_evidence_point_in_time_ready"]:
              raise SystemExit("bank PIT evidence must remain blocked")
          if report["readiness_promotion_allowed"]:
              raise SystemExit("diagnostic audit must not promote readiness")
          PY
      - name: Publish audit evidence
        if: always()
        run: |
          if [ -f bcb-pillar3-dasfn-pit-source-audit.json ]; then
            cat bcb-pillar3-dasfn-pit-source-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bcb-pillar3-dasfn-pit-source-evidence
          path: bcb-pillar3-dasfn-pit-source-audit.json
          if-no-files-found: error
          retention-days: 14
