name: historical-backtest-readiness-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/historical-backtest-readiness-smoke.yml"
      - "scripts/historical_backtest_readiness_audit.py"
      - "scripts/historical_event_aware_m15_integration.py"
      - "src/ultimate_stock_analyzer/backtesting/readiness.py"
      - "src/ultimate_stock_analyzer/backtesting/readiness_corporate_actions.py"
      - "src/ultimate_stock_analyzer/backtesting/raw_price_provenance.py"
      - "src/ultimate_stock_analyzer/backtesting/historical_event_dataset.py"
      - "src/ultimate_stock_analyzer/backtesting/b3_event_aware_coverage.py"
      - "src/ultimate_stock_analyzer/backtesting/b3_share_action_conversion.py"
      - "src/ultimate_stock_analyzer/backtesting/portfolio.py"
      - "src/ultimate_stock_analyzer/backtesting/returns.py"
      - "src/ultimate_stock_analyzer/bootstrap/**"
      - "src/ultimate_stock_analyzer/collectors/b3_classification.py"
      - "src/ultimate_stock_analyzer/collectors/b3_corporate_actions.py"
      - "src/ultimate_stock_analyzer/collectors/b3_dividends.py"
      - "src/ultimate_stock_analyzer/collectors/bcb_ifdata.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/domain/master.py"
      - "src/ultimate_stock_analyzer/fundamentals/**"
      - "src/ultimate_stock_analyzer/market/prices.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"
      - "src/ultimate_stock_analyzer/scoring/sector_models.py"
      - "config/scoring/sector_registry_v0.6.yml"
      - "config/scoring/sectors/**"
      - "tests/test_raw_price_provenance.py"
      - "tests/test_readiness_corporate_actions.py"

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve bounded completed-year window
        id: years
        shell: bash
        run: |
          CURRENT_YEAR=$(date -u +%Y)
          END_YEAR=$((CURRENT_YEAR - 1))
          START_YEAR=$((END_YEAR - 1))
          echo "start=$START_YEAR" >> "$GITHUB_OUTPUT"
          echo "end=$END_YEAR" >> "$GITHUB_OUTPUT"
      - name: Run bounded event-aware M15 capability evidence
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/historical_event_aware_m15_integration.py \
            --sample MGLU:MGLU3 \
            --sample ITSA:ITSA4 \
            --sample B3SA:B3SA3 \
            --sample AMER:AMER3 \
            --start-year 2024 \
            --end-year 2025 \
            --output historical-event-aware-m15-integration.json
      - name: Run fail-closed historical readiness audit
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/historical_backtest_readiness_audit.py \
            --start-year "${{ steps.years.outputs.start }}" \
            --end-year "${{ steps.years.outputs.end }}" \
            --ticker PETR4 \
            --ticker VALE3 \
            --ticker ITUB4 \
            --data-dir "${{ runner.temp }}/ultimate-stock-analyzer-readiness" \
            --event-aware-integration-report historical-event-aware-m15-integration.json \
            --output historical-backtest-readiness.json
      - name: Publish readiness evidence
        if: always()
        run: |
          if [ -f historical-event-aware-m15-integration.json ]; then
            cat historical-event-aware-m15-integration.json
          fi
          if [ -f historical-backtest-readiness.json ]; then
            cat historical-backtest-readiness.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-backtest-readiness
          path: |
            historical-event-aware-m15-integration.json
            historical-backtest-readiness.json
          if-no-files-found: error
          retention-days: 14
