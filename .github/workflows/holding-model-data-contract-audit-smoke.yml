name: holding-model-data-contract-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/holding-model-data-contract-audit-smoke.yml"
      - "scripts/holding_model_data_contract_audit.py"
      - "src/ultimate_stock_analyzer/scoring/holding_model_audit.py"
      - "src/ultimate_stock_analyzer/domain/master.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"
      - "src/ultimate_stock_analyzer/fundamentals/metrics.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Audit holding-model CVM data contract
        run: |
          python scripts/holding_model_data_contract_audit.py \
            --year 2025 \
            --output holding-model-data-contract-audit.json
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f holding-model-data-contract-audit.json ]; then
            cat holding-model-data-contract-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holding-model-data-contract-audit
          path: holding-model-data-contract-audit.json
          if-no-files-found: error
          retention-days: 14
