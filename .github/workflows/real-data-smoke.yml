name: real-data-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/real-data-smoke.yml"
      - "scripts/real_data_smoke.py"
      - "src/ultimate_stock_analyzer/bootstrap/**"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/market/prices.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Resolve completed year
        id: year
        shell: bash
        run: |
          echo "value=$(python -c 'from datetime import UTC, datetime; print(datetime.now(UTC).year - 1)')" >> "$GITHUB_OUTPUT"
      - name: Run official-source smoke test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/real_data_smoke.py \
            --year "${{ steps.year.outputs.value }}" \
            --ticker PETR4 \
            --ticker VALE3 \
            --ticker ITUB4 \
            --data-dir "${{ runner.temp }}/ultimate-stock-analyzer-data" \
            --output-dir "./smoke-artifacts"
      - name: Publish diagnostic summary
        if: always()
        run: |
          if [ -f smoke-artifacts/smoke_summary.json ]; then
            cat smoke-artifacts/smoke_summary.json
          fi
      - name: Upload manifests and summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-data-smoke-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: error
          retention-days: 7
