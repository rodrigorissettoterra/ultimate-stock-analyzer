name: cvm-enet-public-document-status-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cvm-enet-public-document-status-audit-smoke.yml"
      - "scripts/cvm_enet_public_document_status_audit.py"
      - "src/ultimate_stock_analyzer/backtesting/cvm_enet_public_document_status_audit.py"
      - "tests/test_cvm_enet_public_document_status_audit.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe current public ENET grid contract
        run: |
          python scripts/cvm_enet_public_document_status_audit.py \
            --output cvm-enet-public-document-status-audit.json
      - name: Validate public contract and fail-closed PIT boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("cvm-enet-public-document-status-audit.json").read_text(
                  encoding="utf-8"
              )
          )
          if report["schema_version"] != "0.1":
              raise SystemExit("unexpected ENET public-status audit schema")
          if report["effect"] != "diagnostic_only_cvm_enet_public_status_no_readiness_change":
              raise SystemExit("unexpected ENET public-status audit effect")
          if report["cvm_code"] != 19348:
              raise SystemExit("unexpected target CVM code")
          if not report["session_bootstrap"]["trusted"]:
              raise SystemExit("public ENET page bootstrap was not trusted")
          if report["query_count"] != 4:
              raise SystemExit("expected four one-day ENET probes")
          if report["trusted_query_count"] != 4:
              raise SystemExit("one or more ENET POST responses were not trusted")
          if report["usable_contract_count"] != 4:
              raise SystemExit("current ENET ListarDocumentos contract was not usable")
          if report["target_document_query_count"] != 4:
              raise SystemExit("Itaú Pillar 3 target was not observed in every bounded date probe")
          if not report["observed_status_tokens"]:
              raise SystemExit("public grid did not expose a recognized document status")
          if not report["public_current_status_contract_observed"]:
              raise SystemExit("public current-status contract was not observed")

          contract = report["request_contract"]
          if contract["redirects_followed"]:
              raise SystemExit("ENET public-status audit must not follow redirects")
          if contract["server_side_company_filter_used"]:
              raise SystemExit("probe must not depend on undocumented company-filter encoding")
          if contract["date_window_days"] != 1:
              raise SystemExit("ENET probes must remain one-day bounded queries")
          if contract["max_response_bytes_per_query"] > 2_000_000:
              raise SystemExit("ENET response bound exceeded")

          required = {
              "BANK_EVIDENCE_NOT_POINT_IN_TIME",
              "PILLAR3_IPE_REVISION_HISTORY_COMPLETENESS_UNPROVEN",
              "PILLAR3_IPE_DOCUMENT_ACTION_HISTORY_UNPROVEN",
          }
          if not required.issubset(report["blockers"]):
              raise SystemExit("required IPE/ENET PIT blockers disappeared")
          for field in (
              "historical_action_timeline_proven",
              "revision_history_completeness_proven",
              "bank_evidence_point_in_time_ready",
              "readiness_promotion_allowed",
          ):
              if report[field]:
                  raise SystemExit(f"diagnostic ENET audit must keep {field}=false")
          PY
      - name: Publish diagnostic evidence
        if: always()
        run: |
          if [ -f cvm-enet-public-document-status-audit.json ]; then
            cat cvm-enet-public-document-status-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvm-enet-public-document-status-evidence
          path: cvm-enet-public-document-status-audit.json
          if-no-files-found: error
          retention-days: 14
