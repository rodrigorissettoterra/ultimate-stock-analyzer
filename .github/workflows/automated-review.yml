name: automated-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review-python-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install review tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" bandit
      - name: Collect changed Python files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.py' \
            | grep -E '^(src/|scripts/)' > /tmp/changed-python.txt || true
          cat /tmp/changed-python.txt
          if [ -s /tmp/changed-python.txt ]; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Static type review
        if: steps.changed.outputs.has_python == 'true'
        run: |
          mapfile -t files < /tmp/changed-python.txt
          mypy "${files[@]}"
      - name: Security review
        if: steps.changed.outputs.has_python == 'true'
        run: |
          mapfile -t files < /tmp/changed-python.txt
          bandit -q "${files[@]}"
      - name: Compile review
        if: steps.changed.outputs.has_python == 'true'
        run: |
          mapfile -t files < /tmp/changed-python.txt
          python -m py_compile "${files[@]}"
      - name: Review summary
        run: |
          {
            echo "## Automated review"
            echo
            if [ -s /tmp/changed-python.txt ]; then
              echo "Reviewed changed source/script Python files with mypy, Bandit, and py_compile."
              echo
              sed 's/^/- `/' /tmp/changed-python.txt | sed 's/$/`/'
            else
              echo "No changed source/script Python files required incremental review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
