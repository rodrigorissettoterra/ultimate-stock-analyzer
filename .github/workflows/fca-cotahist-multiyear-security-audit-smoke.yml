name: fca-cotahist-multiyear-security-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fca-cotahist-multiyear-security-audit-smoke.yml"
      - "scripts/fca_cotahist_multiyear_security_audit.py"
      - "src/ultimate_stock_analyzer/universe/multiyear_security_audit.py"
      - "src/ultimate_stock_analyzer/market/prices.py"
      - "src/ultimate_stock_analyzer/domain/master.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"
      - "src/ultimate_stock_analyzer/collectors/b3_classification.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Reconcile five-year FCA ticker identity with B3 COTAHIST
        run: python scripts/fca_cotahist_multiyear_security_audit.py
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f fca-cotahist-multiyear-security-audit.json ]; then
            cat fca-cotahist-multiyear-security-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fca-cotahist-multiyear-security-audit
          path: fca-cotahist-multiyear-security-audit.json
          if-no-files-found: error
          retention-days: 14
