name: itsa-structural-abstention-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/itsa-structural-abstention-smoke.yml"
      - "scripts/itsa_structural_abstention_regression.py"
      - "src/ultimate_stock_analyzer/scoring/itsa_structural_abstention.py"
      - "src/ultimate_stock_analyzer/scoring/sector_models.py"
      - "src/ultimate_stock_analyzer/scoring/structural.py"
      - "src/ultimate_stock_analyzer/scoring/applicability_review.py"
      - "src/ultimate_stock_analyzer/collectors/b3_classification.py"
      - "src/ultimate_stock_analyzer/collectors/cvm_foreign.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"
      - "src/ultimate_stock_analyzer/universe/**"
      - "config/scoring/sector_registry_v0.6.yml"
      - "config/scoring/sectors/itsa_holding_abstain_v0.6.yml"
      - "config/universe/b3_structural_applicability_reviews_v0.5.json"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Validate ITSA issuer-specific structural abstention
        run: |
          python scripts/itsa_structural_abstention_regression.py \
            --output itsa-structural-abstention-regression.json
      - name: Publish regression evidence
        if: always()
        run: |
          if [ -f itsa-structural-abstention-regression.json ]; then
            cat itsa-structural-abstention-regression.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itsa-structural-abstention-regression
          path: itsa-structural-abstention-regression.json
          if-no-files-found: error
          retention-days: 14
