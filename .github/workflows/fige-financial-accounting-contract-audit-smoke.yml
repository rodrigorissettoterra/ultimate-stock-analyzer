name: fige-financial-accounting-contract-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fige-financial-accounting-contract-audit-smoke.yml"
      - "scripts/fige_financial_accounting_contract_audit.py"
      - "src/ultimate_stock_analyzer/fundamentals/fige_financial_contract.py"
      - "src/ultimate_stock_analyzer/fundamentals/contracts.py"
      - "src/ultimate_stock_analyzer/collectors/cvm_targeted_statements.py"
      - "src/ultimate_stock_analyzer/scoring/statement_tree_audit.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Audit FIGE financial accounting contract
        run: |
          python scripts/fige_financial_accounting_contract_audit.py \
            --start-year 2021 \
            --end-year 2025 \
            --output fige-financial-accounting-contract-audit.json
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f fige-financial-accounting-contract-audit.json ]; then
            cat fige-financial-accounting-contract-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fige-financial-accounting-contract-audit
          path: fige-financial-accounting-contract-audit.json
          if-no-files-found: error
          retention-days: 14
