name: current-brazilian-equity-security-universe-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/current-brazilian-equity-security-universe-smoke.yml"
      - "scripts/current_brazilian_equity_security_universe_smoke.py"
      - "src/ultimate_stock_analyzer/universe/**"
      - "src/ultimate_stock_analyzer/domain/master.py"
      - "src/ultimate_stock_analyzer/collectors/b3_classification.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/collectors/cvm_foreign.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"

permissions:
  contents: read

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Validate current Brazilian listed-equity security universe
        run: python scripts/current_brazilian_equity_security_universe_smoke.py
      - name: Publish eligibility summary
        if: always()
        run: |
          if [ -f current-brazilian-equity-security-universe.json ]; then
            cat current-brazilian-equity-security-universe.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-brazilian-equity-security-universe
          path: current-brazilian-equity-security-universe.json
          if-no-files-found: error
          retention-days: 14
