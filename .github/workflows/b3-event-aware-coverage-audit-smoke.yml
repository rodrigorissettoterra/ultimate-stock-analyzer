name: b3-event-aware-coverage-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/b3-event-aware-coverage-audit-smoke.yml"
      - "scripts/b3_event_aware_coverage_audit.py"
      - "src/ultimate_stock_analyzer/backtesting/b3_event_aware_coverage.py"
      - "src/ultimate_stock_analyzer/backtesting/b3_share_action_conversion.py"
      - "src/ultimate_stock_analyzer/backtesting/returns.py"
      - "src/ultimate_stock_analyzer/collectors/b3_corporate_actions.py"
      - "src/ultimate_stock_analyzer/collectors/b3_dividends.py"
      - "src/ultimate_stock_analyzer/market/prices.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run live event-aware coverage audit
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/b3_event_aware_coverage_audit.py \
            --sample MGLU:MGLU3 \
            --sample ITSA:ITSA4 \
            --sample B3SA:B3SA3 \
            --sample AMER:AMER3 \
            --start-year 2024 \
            --end-year 2025 \
            --output b3-event-aware-coverage-audit.json
      - name: Validate diagnostic boundaries and observed conversions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("b3-event-aware-coverage-audit.json").read_text(encoding="utf-8")
          )
          expected_effect = "diagnostic_only_event_aware_coverage_no_readiness_change"
          if report["effect"] != expected_effect:
              raise SystemExit("unexpected coverage-audit effect")
          if report["sample_count"] != 4:
              raise SystemExit("unexpected live sample count")
          if report["converted_share_action_count"] < 3:
              raise SystemExit("too few validated ShareAction conversions")
          if report["converted_cash_distribution_count"] < 4:
              raise SystemExit("too few validated cash-distribution conversions")
          if (
              report["relevant_cash_event_count"]
              < report["converted_cash_distribution_count"]
          ):
              raise SystemExit("cash conversion accounting is inconsistent")
          required = "B3_SUPPLEMENT_HISTORICAL_COMPLETENESS_UNPROVEN"
          if required not in report["strict_blockers"]:
              raise SystemExit("historical source-completeness blocker disappeared")
          if report["historical_source_completeness_proven"]:
              raise SystemExit("latest-state supplement cannot prove historical completeness")
          if report["event_aware_return_path_ready"]:
              raise SystemExit("unproven source completeness must block the return path")
          if report["strict_event_aware_backtest_ready"]:
              raise SystemExit("diagnostic audit must not promote strict readiness")
          if report["readiness_promotion_allowed"]:
              raise SystemExit("readiness promotion must remain disabled")
          if report["price_adjustment_applied"]:
              raise SystemExit("raw COTAHIST must remain unadjusted")
          if report["price_series_blocker_removed"]:
              raise SystemExit("price-series blocker must remain unchanged")
          for audit in report["audits"]:
              for conversion in audit["cash_conversions"]:
                  if conversion["distribution"] is None:
                      continue
                  if conversion["ex_date"] <= conversion["com_date"]:
                      raise SystemExit("cash EX session must be after lastDatePrior")
                  if not conversion["point_in_time_eligible"]:
                      raise SystemExit("converted cash event must have PIT availability")
                  if conversion["available_from"] is None:
                      raise SystemExit("converted cash event lost its availability timestamp")
          PY
      - name: Publish audit evidence
        if: always()
        run: |
          if [ -f b3-event-aware-coverage-audit.json ]; then
            cat b3-event-aware-coverage-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b3-event-aware-coverage-evidence
          path: b3-event-aware-coverage-audit.json
          if-no-files-found: error
          retention-days: 14
