name: b3-sector-coverage-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 1"
  pull_request:
    paths:
      - "src/ultimate_stock_analyzer/collectors/b3_classification.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/collectors/cvm_foreign.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"
      - "src/ultimate_stock_analyzer/scoring/applicability_review.py"
      - "src/ultimate_stock_analyzer/scoring/sector_coverage.py"
      - "src/ultimate_stock_analyzer/scoring/sector_models.py"
      - "src/ultimate_stock_analyzer/universe/**"
      - "config/scoring/sector_registry_v0.6.yml"
      - "config/scoring/sectors/financial_non_prudential_abstain_v0.6.yml"
      - "config/universe/b3_non_equity_issuer_exclusions_v0.1.json"
      - "config/universe/b3_structural_applicability_reviews_v0.3.json"
      - "scripts/b3_sector_coverage_manifest.py"
      - ".github/workflows/b3-sector-coverage-smoke.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Generate sanitized B3 sector coverage manifest
        run: python scripts/b3_sector_coverage_manifest.py --output b3-sector-coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: b3-sector-coverage
          path: b3-sector-coverage.json
          if-no-files-found: error
          retention-days: 14
