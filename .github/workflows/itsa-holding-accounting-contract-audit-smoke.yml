name: itsa-holding-accounting-contract-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/itsa-holding-accounting-contract-audit-smoke.yml"
      - "scripts/itsa_holding_accounting_contract_audit.py"
      - "src/ultimate_stock_analyzer/fundamentals/itsa_holding_contract.py"
      - "src/ultimate_stock_analyzer/fundamentals/contracts.py"
      - "src/ultimate_stock_analyzer/fundamentals/metrics.py"
      - "src/ultimate_stock_analyzer/scoring/statement_tree_audit.py"
      - "src/ultimate_stock_analyzer/collectors/cvm_targeted_statements.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Validate ITSA holding accounting contract
        run: |
          python scripts/itsa_holding_accounting_contract_audit.py \
            --year 2025 \
            --output itsa-holding-accounting-contract-audit.json
      - name: Publish accounting-contract evidence
        if: always()
        run: |
          if [ -f itsa-holding-accounting-contract-audit.json ]; then
            cat itsa-holding-accounting-contract-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: itsa-holding-accounting-contract-audit
          path: itsa-holding-accounting-contract-audit.json
          if-no-files-found: error
          retention-days: 14
