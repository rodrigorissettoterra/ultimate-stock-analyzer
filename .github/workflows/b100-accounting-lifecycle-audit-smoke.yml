name: b100-accounting-lifecycle-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/b100-accounting-lifecycle-audit-smoke.yml"
      - "scripts/b100_accounting_lifecycle_audit.py"
      - "src/ultimate_stock_analyzer/scoring/b100_accounting_lifecycle.py"
      - "src/ultimate_stock_analyzer/scoring/itsa_peer_discovery.py"
      - "src/ultimate_stock_analyzer/fundamentals/contracts.py"
      - "src/ultimate_stock_analyzer/fundamentals/cvm_accounts.py"
      - "src/ultimate_stock_analyzer/fundamentals/metrics.py"
      - "src/ultimate_stock_analyzer/collectors/cvm_targeted_statements.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Audit B100 accounting lifecycle
        run: |
          python scripts/b100_accounting_lifecycle_audit.py \
            --output b100-accounting-lifecycle-audit.json
      - name: Publish lifecycle evidence
        if: always()
        run: |
          if [ -f b100-accounting-lifecycle-audit.json ]; then
            cat b100-accounting-lifecycle-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b100-accounting-lifecycle-audit
          path: b100-accounting-lifecycle-audit.json
          if-no-files-found: error
          retention-days: 14
