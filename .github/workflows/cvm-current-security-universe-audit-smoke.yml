name: cvm-current-security-universe-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cvm-current-security-universe-audit-smoke.yml"
      - "scripts/cvm_current_security_universe_audit.py"
      - "src/ultimate_stock_analyzer/universe/security_audit.py"
      - "src/ultimate_stock_analyzer/domain/master.py"
      - "src/ultimate_stock_analyzer/collectors/cvm.py"
      - "src/ultimate_stock_analyzer/normalization/cvm.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Audit current FCA security universe
        run: |
          python scripts/cvm_current_security_universe_audit.py \
            --company-id cvm:6041 \
            --company-id cvm:18759 \
            --company-id cvm:27634 \
            --company-id cvm:7617 \
            --company-id cvm:9512 \
            --require-company-id cvm:9512 \
            --output cvm-current-security-universe-audit.json
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f cvm-current-security-universe-audit.json ]; then
            cat cvm-current-security-universe-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cvm-current-security-universe-audit
          path: cvm-current-security-universe-audit.json
          if-no-files-found: error
          retention-days: 14
