name: fige-financial-statement-tree-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fige-financial-statement-tree-audit-smoke.yml"
      - "scripts/fige_financial_statement_tree_audit.py"
      - "src/ultimate_stock_analyzer/scoring/statement_tree_audit.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Audit FIGE CVM financial statement tree
        run: |
          python scripts/fige_financial_statement_tree_audit.py \
            --year 2025 \
            --max-depth 4 \
            --output fige-financial-statement-tree-audit.json
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f fige-financial-statement-tree-audit.json ]; then
            cat fige-financial-statement-tree-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fige-financial-statement-tree-audit
          path: fige-financial-statement-tree-audit.json
          if-no-files-found: error
          retention-days: 14
