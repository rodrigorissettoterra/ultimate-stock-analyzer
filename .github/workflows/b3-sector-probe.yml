name: b3-sector-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/b3-sector-probe.yml"
      - "scripts/b3_sector_probe.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Probe official B3 classification endpoint
        run: python scripts/b3_sector_probe.py
