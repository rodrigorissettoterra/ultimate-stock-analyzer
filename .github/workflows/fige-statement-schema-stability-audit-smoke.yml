name: fige-statement-schema-stability-audit-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/fige-statement-schema-stability-audit-smoke.yml"
      - "scripts/fige_statement_schema_stability_audit.py"
      - "src/ultimate_stock_analyzer/scoring/statement_schema_stability.py"
      - "src/ultimate_stock_analyzer/scoring/statement_tree_audit.py"
      - "src/ultimate_stock_analyzer/orchestration/cvm_ingestion.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Audit FIGE CVM statement schema stability
        run: |
          python scripts/fige_statement_schema_stability_audit.py \
            --start-year 2021 \
            --end-year 2025 \
            --output fige-statement-schema-stability-audit.json
      - name: Publish audit summary
        if: always()
        run: |
          if [ -f fige-statement-schema-stability-audit.json ]; then
            cat fige-statement-schema-stability-audit.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fige-statement-schema-stability-audit
          path: fige-statement-schema-stability-audit.json
          if-no-files-found: error
          retention-days: 14
