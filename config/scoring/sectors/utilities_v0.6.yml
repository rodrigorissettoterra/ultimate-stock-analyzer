version: "0.6.0"
model_family: "utilities_v1"
peer_group_field: "peer_group"
default_min_peer_count: 8
min_coverage_for_ranking: 0.65
min_confidence_for_ranking: 0.55

category_weights:
  profitability: 0.20
  financial_strength: 0.25
  cash_flow: 0.20
  predictability: 0.15
  growth: 0.05
  dividends: 0.15

metrics:
  - {name: roic, category: profitability, weight: 0.40, direction: higher}
  - {name: roe, category: profitability, weight: 0.25, direction: higher}
  - {name: ebitda_margin, category: profitability, weight: 0.35, direction: higher}

  - {name: net_debt_ebitda, category: financial_strength, weight: 0.35, direction: lower}
  - {name: interest_coverage, category: financial_strength, weight: 0.25, direction: higher}
  - {name: debt_maturity_3y_ratio, category: financial_strength, weight: 0.20, direction: lower}
  - {name: cash_to_debt, category: financial_strength, weight: 0.20, direction: higher}

  - {name: cash_conversion, category: cash_flow, weight: 0.30, direction: target, target: 1.0, tolerance: 1.5}
  - {name: fcf_margin, category: cash_flow, weight: 0.35, direction: higher}
  - {name: cfo_margin, category: cash_flow, weight: 0.35, direction: higher}

  - {name: revenue_volatility_5y, category: predictability, weight: 0.30, direction: lower}
  - {name: ebitda_margin_volatility_5y, category: predictability, weight: 0.35, direction: lower}
  - {name: fcf_positive_years_5y, category: predictability, weight: 0.35, direction: higher}

  - {name: revenue_cagr_5y, category: growth, weight: 0.50, direction: higher}
  - {name: fcf_cagr_5y, category: growth, weight: 0.50, direction: higher}

  - {name: dividend_regularity, category: dividends, weight: 0.40, direction: higher}
  - {name: dividend_sustainability, category: dividends, weight: 0.40, direction: higher}
  - {name: dividend_cagr_5y, category: dividends, weight: 0.20, direction: higher}
