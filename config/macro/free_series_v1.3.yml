version: "1.3.0"

# Small verified starter registry. Additional official series can be added without changing the
# macro engine. Codes are kept explicit and source-specific.
bcb_sgs:
  selic_target:
    factor: selic
    series_code: 432
    unit: percent_per_year
  ipca_monthly:
    factor: inflation
    series_code: 433
    unit: percent_per_month

ibge_sidra:
  # SIDRA is intentionally query-driven because dimensions differ by table. Runtime configuration
  # supplies the full official API query path and field mapping rather than relying on scraping.
  enabled: true
